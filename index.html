<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo VR Mobile - Hand Tracking (EnJoy Style)</title>
  
  <!-- A-Frame VR Framework -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Câmera do Celular Escondida em Segundo Plano -->
  <video id="webcam" style="display: none;" playsinline></video>

  <!-- Cena A-Frame VR -->
  <a-scene embedded vr-mode-ui="enabled: true">
    
    <!-- Iluminação -->
    <a-entity light="type: ambient; color: #BBB"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-0.5 1 1"></a-entity>

    <!-- Céu e Chão -->
    <a-sky color="#ECECF6"></a-sky>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>

    <!-- Cubo Interativo (Objeto para Agarrar com a Mão) -->
    <a-box id="target-box" position="0 1.5 -2" rotation="0 45 0" color="#4CC3D9" shadow></a-box>

    <!-- Cursor da Mão VR (Indicador) -->
    <a-sphere id="hand-cursor" radius="0.05" color="#FFC107" position="0 1.5 -1"></a-sphere>

    <!-- Câmera Rig VR -->
    <a-entity id="rig" position="0 0 0">
      <a-camera position="0 1.6 0" look-controls></a-camera>
    </a-entity>

  </a-scene>

  <script>
    const videoElement = document.getElementById('webcam');
    const handCursor = document.getElementById('hand-cursor');
    const targetBox = document.getElementById('target-box');

    let isPinching = false;

    // Configuração do MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    // Inicialização da Câmera Traseira do Celular
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480,
      facingMode: 'environment' // Usa a câmera traseira do celular
    });

    camera.start();

    // Processamento de Dados de Hand Tracking
    function onResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Posição do Dedo Indicador (Landmark 8) e Polegar (Landmark 4)
        const indexTip = landmarks[8];
        const thumbTip = landmarks[4];

        // Mapeia as coordenadas 2D da tela para o espaço 3D do A-Frame
        const x = (0.5 - indexTip.x) * 3;
        const y = (0.5 - indexTip.y) * 3 + 1.2;
        const z = -1.5;

        handCursor.setAttribute('position', `${x} ${y} ${z}`);

        // Calcula distância entre polegar e indicador para o gesto de Pinça (Pinch)
        const distance = Math.hypot(
          indexTip.x - thumbTip.x,
          indexTip.y - thumbTip.y
        );

        if (distance < 0.08) {
          if (!isPinching) {
            isPinching = true;
            handCursor.setAttribute('color', '#FF5722'); // Muda para vermelho ao pinçar
          }
          // Move o cubo junto com a mão enquanto segura
          targetBox.setAttribute('position', `${x} ${y} ${z}`);
        } else {
          if (isPinching) {
            isPinching = false;
            handCursor.setAttribute('color', '#FFC107'); // Voltar para amarelo
          }
        }
      }
    }
  </script>
</body>
</html>
